<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Da Ferramenta à Transformação — Cotripal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#004A8F;
    --navy-deep:#12294B;
    --wave:#1E4C8A;
    --wave-dark:#183966;
    --mist:#F4F4F6;
    --paper:#FFFFFF;
    --green:#9ACA3C;
    --sky:#0095DA;
    --ink:#152238;
    --ink-soft:#4C5A72;
    --on-navy:#F4F6F8;
    --on-navy-soft:#AFC1DA;
    --line:#DFE4EA;
    --amber:#C98A1F;
    --amber-bg:#FBF3E4;
    --display: "Baloo 2", ui-rounded, "Segoe UI", sans-serif;
    --serif: "Playfair Display", Georgia, serif;
    --body: "Inter", "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --shadow: 0 20px 50px -20px rgba(18,41,75,0.35);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#0B1A30;
    font-family:var(--body);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--sky); color:#fff;}

  a{color:inherit;}

  /* ---------- Stage / viewport ---------- */
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(10px, 3vh, 40px) clamp(10px, 3vw, 40px) calc(clamp(10px, 3vh, 40px) + 64px);
  }
  #frame{
    position:relative;
    width:min(100%, calc((100vh - 150px) * 16 / 9));
    aspect-ratio:16/9;
    background:var(--paper);
    border-radius:18px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }

  .slide{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    padding:clamp(28px, 5vw, 72px) clamp(32px, 6vw, 88px);
    background:var(--paper);
    color:var(--ink);
  }
  .slide.active{display:flex;}

  /* subtle load-in for the active slide only */
  @media (prefers-reduced-motion: no-preference){
    .slide.active{animation:rise .5s cubic-bezier(.19,1,.22,1) both;}
    @keyframes rise{
      from{opacity:0; transform:translateY(14px);}
      to{opacity:1; transform:translateY(0);}
    }
  }

  /* ---------- Chrome shared by light slides ---------- */
  .eyebrow{
    display:flex; align-items:center; justify-content:space-between;
    font-family:var(--mono);
    font-size:clamp(10px,1vw,12px);
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:clamp(16px, 3vh, 28px);
  }
  .eyebrow .tag{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 12px;
    border-radius:999px;
    background:var(--mist);
    color:var(--navy);
    font-weight:600;
  }
  .eyebrow .tag::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--green);
  }
  .eyebrow .count{color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  .slide h2{
    font-family:var(--display);
    font-weight:700;
    color:var(--navy);
    font-size:clamp(22px, 3.1vw, 38px);
    line-height:1.12;
    margin:0 0 clamp(12px,2.4vh,22px);
    letter-spacing:-.01em;
  }
  .slide .kicker{
    font-family:var(--mono);
    font-size:clamp(10px,1vw,12.5px);
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--sky);
    font-weight:600;
    margin-bottom:8px;
  }
  .slide .content-center{
    flex:1; min-height:0;
    display:flex; flex-direction:column;
    justify-content:center;
    overflow:auto;
  }
  .slide .body{
    font-size:clamp(13px, 1.5vw, 18px);
    line-height:1.55;
    color:var(--ink);
  }
  .slide .body p{margin:0 0 .8em;}
  .slide .body strong{color:var(--navy);}
  .slide .body em{color:var(--ink-soft);}
  .slide .body ul{margin:.2em 0 .9em; padding-left:1.2em;}
  .slide .body li{margin-bottom:.4em;}

  /* ---------- Dark (wave) slides: cover + section openers ---------- */
  .slide.dark{
    color:var(--on-navy);
    background:linear-gradient(160deg,var(--wave) 0%, var(--wave-dark) 55%, var(--navy-deep) 100%);
    justify-content:center;
  }
  .slide.dark .wave-deco{
    position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .slide.dark .content{position:relative; z-index:1;}

  .block-num{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(52px, 8vw, 108px);
    line-height:1;
    color:rgba(244,246,248,0.16);
    margin-bottom:.25em;
  }
  .slide.dark .kicker{color:var(--green); margin-bottom:16px;}
  .slide.dark h1, .slide.dark h2{
    font-family:var(--display);
    font-weight:700;
    color:#fff;
    font-size:clamp(26px, 4.2vw, 52px);
    line-height:1.14;
    letter-spacing:-.01em;
    margin:0 0 .5em;
    max-width:16ch;
  }
  .slide.dark .sub{
    font-size:clamp(13px,1.7vw,19px);
    color:var(--on-navy-soft);
    max-width:52ch;
    line-height:1.6;
    margin-top:.3em;
  }
  .leaf{position:absolute; border-radius:60% 40% 55% 45%/45% 55% 40% 60%;}

  /* ---------- Cover slide ---------- */
  .slide-cover{padding:0;}
  .slide-cover .cover-bg{
    position:absolute; inset:0;
    background-image:url('cotripal-cover.png');
    background-size:cover; background-position:center;
  }
  .slide-cover .cover-scrim{display:none;}
  .slide-cover .cover-content{
    position:relative; z-index:1;
    height:100%;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:clamp(28px,5vw,72px) clamp(32px,6vw,88px);
  }
  .slide-cover .cover-card{
    display:inline-block;
    width:fit-content;
    max-width:64%;
    background:rgba(7,17,34,0.64);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    border-radius:16px;
    padding:clamp(16px,2.4vw,28px) clamp(20px,2.8vw,32px);
  }
  .slide-cover .eyebrow-top{
    position:absolute; top:clamp(28px,5vw,64px); left:clamp(32px,6vw,88px);
    font-family:var(--mono); font-size:clamp(10px,1vw,12px); letter-spacing:.12em;
    text-transform:uppercase; color:var(--navy); font-weight:600;
  }
  .slide-cover h1{
    font-family:var(--display); font-weight:800; color:#fff;
    font-size:clamp(30px,5vw,58px); line-height:1.05; margin:0 0 .2em; max-width:14ch;
  }
  .slide-cover .cover-sub{
    font-family:var(--body); color:var(--on-navy-soft);
    font-size:clamp(13px,1.6vw,18px); max-width:44ch; margin-bottom:1.1em;
  }
  .slide-cover .cover-meta{
    display:flex; flex-wrap:wrap; gap:10px 22px;
    font-family:var(--mono); font-size:clamp(10.5px,1.1vw,13px);
    color:#fff; letter-spacing:.02em;
  }
  .slide-cover .cover-meta b{font-weight:600;}

  /* ---------- Stat grid ---------- */
  .stat-grid{
    display:grid; gap:clamp(10px,1.6vw,20px);
    grid-template-columns:repeat(var(--cols,2), 1fr);
    margin-top:clamp(4px,1vh,10px);
  }
  .stat-card{
    background:var(--mist);
    border-radius:14px;
    padding:clamp(14px,1.6vw,22px);
    display:flex; flex-direction:column; gap:6px;
  }
  .stat-card .val{
    font-family:var(--display); font-weight:700; color:var(--navy);
    font-size:clamp(20px,2.6vw,34px); line-height:1.05;
  }
  .stat-card .label{font-size:clamp(11.5px,1.15vw,14.5px); color:var(--ink); line-height:1.35;}
  .stat-card .src{margin-top:auto; padding-top:6px;}

  /* ---------- Source pills ---------- */
  .src-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:clamp(9.5px,.95vw,11.5px);
    color:var(--navy); text-decoration:none;
    border:1px solid var(--line); border-radius:999px;
    padding:4px 10px; background:#fff;
    transition:border-color .15s, background .15s;
  }
  .src-pill:hover{border-color:var(--sky); background:#EAF6FD;}
  .src-pill.pending{
    color:var(--amber); border-color:transparent; background:var(--amber-bg);
    cursor:default;
  }
  .src-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}

  /* ---------- Example cards ---------- */
  .example{
    display:flex; flex-direction:column; gap:10px; height:100%; justify-content:center;
  }
  .example .tag-row{display:flex; align-items:center; gap:10px;}
  .example .icon-dot{width:34px;height:34px;border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--mist); font-size:16px;}
  .result-box{
    background:var(--navy); color:#fff; border-radius:14px;
    padding:clamp(14px,1.8vw,22px); margin-top:6px;
  }
  .result-box .lbl{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--on-navy-soft); margin-bottom:4px;}
  .result-box .val{font-family:var(--display); font-weight:700; font-size:clamp(17px,2vw,24px);}

  /* ---------- Table ---------- */
  table.tbl{width:100%; border-collapse:collapse; font-size:clamp(11.5px,1.25vw,15px);}
  table.tbl th{
    text-align:left; font-family:var(--mono); font-size:.78em; letter-spacing:.04em;
    text-transform:uppercase; color:#fff; background:var(--navy);
    padding:10px 12px;
  }
  table.tbl th:first-child{border-radius:8px 0 0 0;}
  table.tbl th:last-child{border-radius:0 8px 0 0;}
  table.tbl td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.tbl tr:nth-child(even) td{background:var(--mist);}
  table.tbl.tbl-dense{font-size:clamp(9.5px,1vw,12px);}
  table.tbl.tbl-dense th{padding:7px 10px;}
  table.tbl.tbl-dense td{padding:7px 10px; line-height:1.35;}
  .slide .body p.lede{color:var(--ink-soft); font-size:.92em; margin-bottom:.6em;}

  /* ---------- Callout / pending / step ---------- */
  .callout{
    border-left:3px solid var(--sky); background:var(--mist);
    padding:10px 16px; border-radius:0 10px 10px 0; font-size:.92em; color:var(--ink-soft);
    margin-top:10px;
  }
  .pending-box{
    border:1.5px dashed var(--amber); background:var(--amber-bg);
    color:#8A5D10; border-radius:12px; padding:14px 18px; font-size:.92em; margin-top:10px;
  }
  .pending-box b{color:#8A5D10;}
  .steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;}
  .steps li{display:flex; gap:14px; align-items:flex-start;}
  .steps .n{
    font-family:var(--display); font-weight:700; color:var(--navy);
    background:var(--mist); border-radius:50%; width:32px; height:32px;
    display:flex; align-items:center; justify-content:center; flex:none; font-size:14px;
  }

  /* ---------- Newspaper clipping ---------- */
  .clip-row{display:flex; gap:clamp(16px,2.4vw,32px); align-items:stretch; height:100%;}
  .clip-row.single{justify-content:flex-start;}
  .clipping{
    background:#FBF8F1;
    border:1px solid #E4DCC8;
    box-shadow:0 14px 30px -16px rgba(30,20,5,0.35), 0 2px 0 rgba(30,20,5,0.04);
    padding:clamp(16px,2vw,26px) clamp(16px,2vw,24px) clamp(20px,2.4vw,28px);
    position:relative;
    flex:1;
    min-width:0;
    display:flex; flex-direction:column;
    transform:rotate(var(--tilt, -0.8deg));
  }
  .clip-row .clipping:nth-child(2){--tilt:0.6deg;}
  .clipping::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px; height:10px;
    background:repeating-linear-gradient(115deg, #FBF8F1 0 6px, transparent 6px 12px);
    background-color:transparent;
    -webkit-mask:repeating-linear-gradient(100deg, #000 0 8px, transparent 8px 14px);
    mask:repeating-linear-gradient(100deg, #000 0 8px, transparent 8px 14px);
    background:#FBF8F1;
    border-bottom:1px solid #E4DCC8;
  }
  .clipping .tape{
    position:absolute; top:-10px; left:26px; width:56px; height:20px;
    background:rgba(154,202,60,0.55);
    border:1px solid rgba(154,202,60,0.7);
    transform:rotate(-3deg);
  }
  .clipping .masthead{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    color:#8A7F63; border-bottom:1px solid #E4DCC8; padding-bottom:8px; margin-bottom:12px;
    display:flex; justify-content:space-between;
  }
  .clipping .headline{
    font-family:var(--serif); font-weight:700; color:#1E1A12;
    font-size:clamp(22px,2.6vw,32px); line-height:1.08; margin-bottom:8px;
  }
  .clipping .dek{
    font-family:var(--body); color:#4A4536; font-size:clamp(12px,1.15vw,14.5px);
    line-height:1.5; margin-bottom:12px;
  }
  .clipping.compact{padding:clamp(12px,1.6vw,20px) clamp(14px,1.8vw,20px) clamp(16px,2vw,22px);}
  .clipping.compact .headline{font-size:clamp(19px,2.2vw,26px); margin-bottom:6px;}
  .clipping.compact .dek{font-size:clamp(11px,1.05vw,13px); margin-bottom:8px;}
  .clipping.compact .clip-img{min-height:56px; padding:10px; margin-bottom:8px;}
  .clipping.compact .clip-img span.big{font-size:16px;}
  .clipping.compact .masthead{margin-bottom:8px; padding-bottom:6px;}
  .clip-img{
    border:1.5px dashed #C9BC9C; border-radius:4px; background:#F2EDDF;
    color:#8A7F63; font-family:var(--mono); font-size:11px; text-align:center;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
    padding:14px; margin-bottom:12px; min-height:70px; flex:1;
  }
  .clip-img span.big{font-size:20px;}
  .clipping .byline{
    margin-top:auto; font-family:var(--mono); font-size:10.5px; color:#8A7F63;
    display:flex; align-items:center; gap:6px;
  }
  .clipping .byline a{color:#1E4C8A; text-decoration:none; border-bottom:1px dotted #1E4C8A;}

  /* ---------- Icon-forward two column ---------- */
  .concept-cols{display:grid; grid-template-columns:1fr 1fr; gap:clamp(14px,2vw,26px); align-items:stretch;}
  .concept-card{
    background:var(--mist); border-radius:16px; padding:clamp(16px,2vw,26px);
    display:flex; flex-direction:column; gap:8px;
  }
  .concept-card .ic{
    width:44px; height:44px; border-radius:12px; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow:0 6px 14px -8px rgba(18,41,75,0.3);
  }
  .concept-card h3{font-family:var(--display); color:var(--navy); font-size:clamp(15px,1.7vw,19px); margin:6px 0 2px;}
  .concept-card p{font-size:clamp(12px,1.2vw,14.5px); line-height:1.5; color:var(--ink); margin:0;}
  .concept-vs{
    align-self:center; font-family:var(--mono); color:var(--ink-soft); font-size:11px;
    text-transform:uppercase; letter-spacing:.1em;
  }

  /* ---------- Icon grid (tipos, ferramentas, prompt elements) ---------- */
  .icon-grid{display:grid; gap:clamp(10px,1.4vw,16px); grid-template-columns:repeat(var(--gcols,3), 1fr);}
  .icon-grid .gcard{
    background:var(--mist); border-radius:14px; padding:clamp(12px,1.5vw,18px);
    display:flex; flex-direction:column; gap:6px;
  }
  .icon-grid .gcard .gi{font-size:22px; line-height:1;}
  .icon-grid .gcard h4{font-family:var(--display); color:var(--navy); font-size:clamp(13px,1.3vw,15.5px); margin:2px 0 0;}
  .icon-grid .gcard p{font-size:clamp(10.5px,1.05vw,12.5px); color:var(--ink); margin:0; line-height:1.4;}
  .icon-grid .gcard .ex{font-size:clamp(9.5px,.95vw,11px); color:var(--ink-soft); font-style:italic; margin-top:2px;}

  /* ---------- Flow (linear process) ---------- */
  .flow{display:flex; align-items:stretch; gap:10px; flex-wrap:wrap;}
  .flow .fstep{
    flex:1; min-width:140px; background:var(--mist); border-radius:14px;
    padding:clamp(12px,1.6vw,18px); position:relative; display:flex; flex-direction:column; gap:6px;
  }
  .flow .fstep.hi{background:var(--navy); color:#fff;}
  .flow .fstep.hi .fi{filter:brightness(3);}
  .flow .fstep .fi{font-size:20px;}
  .flow .fstep h4{font-family:var(--display); font-size:13.5px; margin:0;}
  .flow .fstep p{font-size:11.5px; margin:0; line-height:1.4; opacity:.9;}
  .flow .farrow{
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
    font-size:20px; flex:none; padding:0 2px;
  }

  /* ---------- Spectrum slider (autonomia) ---------- */
  .spectrum{margin-top:8px;}
  .spectrum .track{
    height:10px; border-radius:999px;
    background:linear-gradient(90deg,#DCE6F2,var(--sky) 50%,var(--navy));
    position:relative; margin:0 6px;
  }
  .spectrum .poles{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-top:8px;}
  .spectrum .marker{
    position:absolute; top:50%; width:22px; height:22px; border-radius:50%;
    background:#fff; border:3px solid var(--navy); transform:translate(-50%,-50%);
    box-shadow:0 4px 10px -3px rgba(18,41,75,0.5);
  }
  .spectrum .ticks{display:flex; justify-content:space-between; margin-top:14px;}
  .spectrum .tick{flex:1; text-align:center; font-size:10.5px; color:var(--ink-soft); padding:0 4px;}
  .spectrum .tick b{display:block; color:var(--navy); font-size:11.5px; margin-bottom:2px;}

  /* ---------- Node network (multi-agent) ---------- */
  .agent-net{display:flex; align-items:center; justify-content:center; gap:0; margin:6px 0;}

  /* ---------- Device frame (clickable "browser window" preview) ---------- */
  .device-frame{
    display:block; text-decoration:none; color:inherit;
    background:#fff; border-radius:14px; overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 16px 34px -18px rgba(18,41,75,0.4);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .device-frame:hover{transform:translateY(-3px); box-shadow:0 22px 40px -16px rgba(18,41,75,0.45);}
  .device-frame .bar{
    display:flex; align-items:center; gap:8px;
    background:#EEF0F3; padding:8px 12px; border-bottom:1px solid var(--line);
  }
  .device-frame .dot{width:8px; height:8px; border-radius:50%; background:#D3D8E0;}
  .device-frame .url{
    flex:1; background:#fff; border:1px solid var(--line); border-radius:999px;
    padding:3px 12px; font-family:var(--mono); font-size:10.5px; color:var(--ink-soft);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .device-frame .go{font-family:var(--mono); font-size:10px; color:var(--sky); flex:none;}
  .device-frame .screen{
    background:linear-gradient(180deg,#F7F5EE,#F0ECE0);
    min-height:150px;
    padding:0; position:relative; overflow:hidden;
  }
  .device-frame .screen iframe{
    width:100%; height:100%; min-height:150px; border:0; display:block;
    pointer-events:none;
  }
  .device-frame .screen .fallback{
    position:absolute; left:8px; bottom:8px;
    background:rgba(255,255,255,0.92); border:1px solid var(--line); border-radius:999px;
    padding:4px 10px; font-family:var(--mono); font-size:9.5px; color:var(--navy);
  }
  .device-frame .screen span.big{font-size:24px;}

  /* ---------- Grid overlay (slide navigator) ---------- */
  #grid-overlay{
    position:fixed; inset:0; z-index:30;
    background:rgba(8,16,30,0.94);
    display:none;
    flex-direction:column;
    padding:22px clamp(16px,4vw,56px) 24px;
  }
  #grid-overlay.open{display:flex;}
  #grid-overlay-head{
    display:flex; align-items:center; justify-content:space-between;
    color:#fff; font-family:var(--display); font-weight:700; font-size:18px;
    margin-bottom:18px;
  }
  #grid-overlay-body{
    flex:1; overflow:auto;
    display:grid; gap:14px;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    align-content:start;
  }
  .grid-tile{
    cursor:pointer; border-radius:10px; overflow:hidden;
    background:#131E33; border:1.5px solid rgba(255,255,255,0.08);
    transition:border-color .15s, transform .15s;
    display:flex; flex-direction:column;
  }
  .grid-tile:hover{border-color:var(--sky); transform:translateY(-2px);}
  .grid-tile.current{border-color:var(--green);}

{ type:'standard', block:2, num:15, blockName:'Fundamentos',
  kicker:'Duas lógicas fundamentalmente diferentes · protótipo C — colunas com ícone',
  title:'O que é IA, de fato',
  body:`<div class="concept-cols">
    <div class="concept-card">
      <div class="ic">⚙️</div>
      <h3>Código determinístico</h3>
      <p>O motor por trás do seu ERP, da planilha de estoque, do sistema de contratos. Regra fixa, escrita por um humano: "se isso, então aquilo." Mesma entrada, sempre a mesma saída. Se está errado, é bug — dá para achar a linha exata que falhou.</p>
    </div>
    <div class="concept-card">
      <div class="ic">✨</div>
      <h3>Inteligência Artificial</h3>
      <p>Aprende padrões a partir de milhões de exemplos. Não segue uma regra escrita à mão — ela <strong>prevê</strong> a continuação mais provável de um texto, uma classificação, uma decisão. A mesma pergunta pode gerar respostas ligeiramente diferentes a cada vez.</p>
    </div>
  </div>
  <div class="callout" style="margin-top:14px;"><strong>Por que isso muda tudo:</strong> um ERP nunca "inventa" um número errado por conta própria. Uma IA pode gerar uma resposta errada com a <strong>mesma confiança</strong> de uma certa — é a base de tudo que vem depois, especialmente do bloco de Segurança.</div>`

  body:`<div class="icon-grid" style="--gcols:4;">

{ type:'standard', block:2, num:25, blockName:'Fundamentos',
  kicker:'Por que a IA alucina',
  title:'Ela não "sabe" fatos — ela prevê a próxima palavra',
  body:`<p>Quando não tem informação suficiente, a IA pode gerar algo plausível e <strong>errado</strong>, com a mesma confiança de uma resposta certa. (Lembra do slide 16? É essa mesma lógica.)</p>
  <p><strong>Risco maior em:</strong> números exatos, datas, nomes, temas pouco conhecidos, pedidos sem contexto suficiente.</p>
  <div class="callout"><strong>Regra:</strong> toda resposta usada para uma decisão de peso — financeira, contratual, de segurança — precisa ser conferida em fonte confiável.</div>`
},
{ type:'standard', block:2, num:26, blockName:'Fundamentos',
  kicker:'Por que a IA "esquece"',
  title:'Janela de contexto',
  body:`<p>Toda IA tem um limite de quanta informação processa de uma vez. Fora desse limite, a informação simplesmente não existe para o modelo — mesmo que tenha sido mencionada antes na conversa.</p>
  <div style="margin:14px 0;">
    <div style="display:flex; height:46px; border-radius:10px; overflow:hidden;">
      <div style="flex:1; background:#1E4C8A; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--mono); font-size:10.5px;">início</div>
      <div style="flex:2.4; background:linear-gradient(90deg,#DCE6F2,#EDF1F6,#DCE6F2); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-family:var(--mono); font-size:10.5px;">meio — mais chance de ser ignorado</div>
      <div style="flex:1; background:#1E4C8A; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--mono); font-size:10.5px;">fim</div>
    </div>
    <div style="text-align:center; font-family:var(--mono); font-size:10px; color:var(--ink-soft); margin-top:6px;">atenção do modelo dentro da janela de contexto</div>
  </div>
  <p><strong>Efeito "Lost in the Middle":</strong> mesmo dentro da janela, informação no meio de um texto longo tem mais chance de ser ignorada — o começo e o fim recebem mais atenção do modelo.</p>
  <div class="callout"><strong>Regra prática:</strong> o mais importante vai no início ou no fim do que você escreve, nunca enterrado no meio de um documento longo.</div>`
},

  body:`<p>A Cotripal já tem uma política de IA própria, com o objetivo de estabelecer diretrizes, regras e responsabilidades para o uso ético, seguro e produtivo de ferramentas e sistemas de IA — aplicável a todos os funcionários, terceiros e prestadores de serviço da cooperativa.</p>
  <div class="pending-box"><b>[A DEFINIR]</b> — só consegui acessar o objetivo/abrangência do documento (o Google Docs bloqueia a leitura completa sem login). Falta o texto completo — regras específicas, papéis e processo de aprovação — para fechar este slide.</div>
  <div class="callout">Toda ideia que sair da oficina (próximo bloco) vai passar por duas perguntas: <strong>que nível de autonomia</strong> (slide 23), e <strong>quem precisa aprovar</strong> (este slide).</div>`
},
// ---------- BLOCO 7 — Oficina ----------
{ type:'opener', block:7, kicker:'Oficina em duplas', title:'Oficina em duplas',
  sub:'Objetivo: cada dupla sai daqui com uma ideia concreta de piloto de IA para o seu setor.'
},
{ type:'standard', block:7, num:37, blockName:'Oficina em duplas',
  title:'O que vamos fazer',
  body:`<ol class="steps">
    <li><span class="n">1</span><span>Mapear um processo real e repetitivo do seu setor <em>(10 min)</em></span></li>
    <li><span class="n">2</span><span>Testar, ao vivo, um prompt real sobre esse processo <em>(15 min)</em></span></li>
    <li><span class="n">3</span><span>Classificar: que nível de autonomia? que nível de aprovação necessária? <em>(15 min)</em></span></li>
    <li><span class="n">4</span><span>Resumir num cartão: problema, abordagem, quem aprova <em>(5 min)</em></span></li>
  </ol>`
},
{ type:'standard', block:7, num:38, blockName:'Oficina em duplas',
  kicker:'Perguntas para destravar',
  title:'Se a dupla travar, pergunte:',
  body:`<ul>
    <li>Que decisão vocês tomam hoje sem dado suficiente?</li>
    <li>Onde vocês perdem mais tempo copiando informação de um lugar para o outro?</li>
    <li>Se isso desse errado, quem seria afetado?</li>
  </ul>`
},
// ---------- BLOCO 8 — Pitch e handoff ----------
{ type:'opener', block:8, kicker:'Pitch e próximos passos', title:'Pitch e próximos passos', sub:'' },
{ type:'standard', block:8, num:40, blockName:'Pitch e handoff',
  title:'2 minutos por dupla',
  body:`<p>Problema · Abordagem · Nível de aprovação necessário</p>
  <div class="callout"><strong>Uma boa ideia de piloto:</strong> processo real e recorrente, impacto mensurável, risco baixo/médio o suficiente para começar rápido.</div>`
},
{ type:'standard', block:8, num:41, blockName:'Pitch e handoff',
  kicker:'Fechamento',
  title:'Isso é o primeiro passo, não um evento isolado',
  body:`<p>Parte da trilha de capacitação contínua prevista no nosso Mapa Estratégico (slide 5, objetivo 9).</p>
  <div class="pending-box"><b>Próximos passos: [A DEFINIR]</b></div>`
},
{ type:'opener', block:8, kicker:'Obrigada', title:'Obrigada!', sub:'Da Ferramenta à Transformação' },
];

// Expand {{PILL:label}} / {{PILL:label|url}} shorthand into real source pills
SLIDES.forEach(s=>{
  if(!s.body) return;
  s.body = s.body.replace(/\{\{PILL:([^|}]+)(?:\|([^}]+))?\}\}/g, (m, label, url)=>{
    return srcPillHTML(label.trim(), url ? url.trim() : null);
  });
});
function srcPillHTML(label, url){
  if(!url) return `<span class="src-pill pending" title="Link a confirmar">🔗 ${label}</span>`;
  return `<a class="src-pill" href="${url}" target="_blank" rel="noopener">🔗 ${label}</a>`;
}
/* SLIDE_DATA_END */

/* ============ RENDERER ============ */
const frame = document.getElementById('frame');

function srcPill(s){
  if(!s.url){
    return `<span class="src-pill pending" title="Link a confirmar">🔗 ${s.label}</span>`;
  }
  return `<a class="src-pill" href="${s.url}" target="_blank" rel="noopener">🔗 ${s.label}</a>`;
}

function renderSources(sources){
  if(!sources || !sources.length) return '';
  return `<div class="src-row">${sources.map(srcPill).join('')}</div>`;
}

function renderSlide(s, idx){
  const id = `slide-${idx+1}`;
  if(s.type === 'cover'){
    return `<section class="slide dark slide-cover" id="${id}">
      <div class="cover-bg"></div>
      <div class="cover-scrim"></div>
      <div class="eyebrow-top">Cotripal · Capacitação Contínua</div>
      <div class="cover-content">
        <div class="cover-card">
          <h1>${s.title}</h1>
          <div class="cover-sub">${s.sub}</div>
          <div class="cover-meta">${s.meta.map(m=>`<span>${m}</span>`).join('<span aria-hidden="true">·</span>')}</div>
        </div>
      </div>
    </section>`;
  }
  if(s.type === 'opener'){
    return `<section class="slide dark" id="${id}">
      ${waveSVG('opener')}
      <div class="content">
        <div class="block-num">Bloco ${s.block}</div>
        <div class="kicker">${s.kicker || ''}</div>
        <h2>${s.title}</h2>
        <div class="sub">${s.sub || ''}</div>
      </div>
    </section>`;
  }
  // standard light slide
  return `<section class="slide" id="${id}">
    <div class="eyebrow">
      <span class="tag">Bloco ${s.block} · ${s.blockName}</span>
      <span class="count">Slide ${idx+1} / ${SLIDES.length}</span>
    </div>
    <div class="content-center">
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ''}
      <h2>${s.title}</h2>
      <div class="body">${s.body}</div>
    </div>
  </section>`;
}

frame.innerHTML = SLIDES.map(renderSlide).join('\n');

/* ============ NAVIGATION ============ */
let current = 0;
const slideEls = Array.from(document.querySelectorAll('.slide'));
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const counter = document.getElementById('counter');
const progressFill = document.getElementById('progress-fill');
const blockLabel = document.getElementById('block-label');

function pad(n){ return String(n).padStart(2,'0'); }

function go(i){
  if(i < 0 || i >= slideEls.length) return;
  slideEls[current].classList.remove('active');
  current = i;
  slideEls[current].classList.add('active');
  counter.textContent = `${pad(current+1)} / ${slideEls.length}`;
  progressFill.style.width = `${(current)/(slideEls.length-1)*100}%`;
  btnPrev.disabled = current === 0;
  btnNext.disabled = current === slideEls.length-1;
  const s = SLIDES[current];
  if(s.type === 'cover'){
    blockLabel.innerHTML = `<b>Abertura</b> — Capa`;
  } else if(s.type === 'opener'){
    blockLabel.innerHTML = `<b>Bloco ${s.block}</b> — ${s.title.replace(/<[^>]+>/g,'')}`;
  } else {
    blockLabel.innerHTML = `<b>Bloco ${s.block}</b> — ${s.blockName}`;
  }
  window.location.hash = `s${current+1}`;
}

btnPrev.addEventListener('click', ()=>go(current-1));
btnNext.addEventListener('click', ()=>go(current+1));

/* ============ GRID OVERLAY (slide navigator) ============ */
const gridOverlay = document.getElementById('grid-overlay');
const gridBody = document.getElementById('grid-overlay-body');
const blockBg = {1:'#1E4C8A',2:'#1E4C8A',3:'#7A5EA8',4:'#3A7D6E',5:'#B8543D',6:'#B8863D',7:'#3D8AB8',8:'#5E6BA8'};

function plainTitle(s){ return (s.title||'').replace(/<[^>]+>/g,' '); }

function buildGrid(){
  gridBody.innerHTML = SLIDES.map((s,i)=>{
    const label = s.type==='cover' ? 'Capa' : plainTitle(s);
    const bg = s.type==='standard' ? 'var(--navy)' : (blockBg[s.block]||'var(--navy)');
    const textColor = s.type==='standard' ? '#fff' : '#fff';
    return `<div class="grid-tile" data-idx="${i}">
      <div class="thumb" style="background:${bg}; color:${textColor};">${label}</div>
      <div class="meta"><span>${pad(i+1)}</span><span>${s.type==='cover' ? 'Capa' : 'Bloco '+s.block}</span></div>
    </div>`;
  }).join('');
  gridBody.querySelectorAll('.grid-tile').forEach(t=>{
    t.addEventListener('click', ()=>{ go(parseInt(t.dataset.idx,10)); closeGrid(); });
  });
}
function openGrid(){
  buildGrid();
  gridOverlay.classList.add('open');
  gridOverlay.setAttribute('aria-hidden','false');
  const cur = gridBody.querySelector(`[data-idx="${current}"]`);
  if(cur) cur.classList.add('current');
}
function closeGrid(){
  gridOverlay.classList.remove('open');
  gridOverlay.setAttribute('aria-hidden','true');
}
document.getElementById('btn-grid').addEventListener('click', openGrid);
document.getElementById('btn-grid-close').addEventListener('click', closeGrid);
gridOverlay.addEventListener('click', (e)=>{ if(e.target===gridOverlay) closeGrid(); });

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){ closeGrid(); return; }
  if(gridOverlay.classList.contains('open')) return;
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); go(current+1); }
  if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(current-1); }
  if(e.key === 'Home'){ go(0); }
  if(e.key === 'End'){ go(slideEls.length-1); }
});
// basic swipe support
let touchX = null;
frame.addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; });
frame.addEventListener('touchend', e=>{
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 50) go(current + (dx < 0 ? 1 : -1));
  touchX = null;
});

// deep link on load
(function init(){
  const m = window.location.hash.match(/^#s(\d+)$/);
  const start = m ? Math.max(0, Math.min(slideEls.length-1, parseInt(m[1],10)-1)) : 0;
  slideEls[0].classList.add('active');
  go(start);
})();
</script>
</body>
</html>
